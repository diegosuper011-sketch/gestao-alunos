<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gestão Acadêmica UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 bg-slate-900/80">
    <div class="mx-auto max-w-6xl px-6 py-5 flex items-center justify-between">
      <div><p class="text-cyan-400 text-sm font-semibold">PROJETO INTEGRADOR</p><h1 class="text-2xl font-bold">Gestão Acadêmica</h1></div>
      <span class="rounded-full bg-cyan-950 px-3 py-1 text-xs text-cyan-300">Painel administrativo</span>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-6 py-8">
    <section class="grid gap-4 sm:grid-cols-3 mb-8">
      <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><p class="text-slate-400 text-sm">Alunos cadastrados</p><p id="total" class="text-3xl font-bold mt-2">0</p></div>
      <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><p class="text-slate-400 text-sm">Média geral</p><p id="average" class="text-3xl font-bold mt-2">0,0</p></div>
      <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><p class="text-slate-400 text-sm">Frequência média</p><p id="attendance" class="text-3xl font-bold mt-2">0%</p></div>
    </section>
    <section class="rounded-2xl border border-slate-800 bg-slate-900 p-6 mb-8">
      <h2 class="text-lg font-semibold mb-4">Cadastrar aluno</h2>
      <form id="studentForm" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
        <input name="name" required placeholder="Nome completo" class="rounded-lg bg-slate-800 p-3 outline-none focus:ring-2 focus:ring-cyan-500">
        <input name="email" type="email" required placeholder="E-mail" class="rounded-lg bg-slate-800 p-3 outline-none focus:ring-2 focus:ring-cyan-500">
        <input name="course" required placeholder="Curso" class="rounded-lg bg-slate-800 p-3 outline-none focus:ring-2 focus:ring-cyan-500">
        <input name="class_name" required placeholder="Turma (ex.: 2A)" class="rounded-lg bg-slate-800 p-3 outline-none focus:ring-2 focus:ring-cyan-500">
        <input name="grade" type="number" min="0" max="10" step="0.1" value="0" placeholder="Nota (0 a 10)" class="rounded-lg bg-slate-800 p-3 outline-none focus:ring-2 focus:ring-cyan-500">
        <input name="attendance" type="number" min="0" max="100" step="1" value="100" placeholder="Frequência (%)" class="rounded-lg bg-slate-800 p-3 outline-none focus:ring-2 focus:ring-cyan-500">
        <button class="rounded-lg bg-cyan-500 px-5 py-3 font-bold text-slate-950 hover:bg-cyan-400 sm:col-span-2 lg:col-span-3">Adicionar aluno</button>
      </form>
      <p id="message" class="mt-3 text-sm text-amber-300"></p>
    </section>
    <section class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
      <div class="flex flex-wrap justify-between gap-3 mb-4"><h2 class="text-lg font-semibold">Alunos cadastrados</h2><input id="search" placeholder="Buscar aluno..." class="rounded-lg bg-slate-800 px-3 py-2 text-sm"></div>
      <div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="text-slate-400 border-b border-slate-700"><tr><th class="p-3">Aluno</th><th class="p-3">Curso / Turma</th><th class="p-3">Nota</th><th class="p-3">Frequência</th><th class="p-3">Ação</th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
  </main>
<script>
let students = [];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load() {
  const r = await fetch('/api/students'); students = await r.json();
  $('#total').textContent = students.length;
  $('#average').textContent = students.length ? (students.reduce((a,s)=>a+Number(s.grade),0)/students.length).toFixed(1).replace('.',',') : '0,0';
  $('#attendance').textContent = students.length ? Math.round(students.reduce((a,s)=>a+Number(s.attendance),0)/students.length)+'%' : '0%';
  render();
}
function render() {
  const q = $('#search').value.toLowerCase();
  $('#rows').innerHTML = students.filter(s => (s.name+' '+s.email+' '+s.course).toLowerCase().includes(q)).map(s => `
    <tr class="border-b border-slate-800">
      <td class="p-3"><b>${esc(s.name)}</b><div class="text-slate-400">${esc(s.email)}</div></td>
      <td class="p-3">${esc(s.course)}<div class="text-slate-400">${esc(s.class_name)}</div></td>
      <td class="p-3">${Number(s.grade).toFixed(1)}</td><td class="p-3">${Number(s.attendance)}%</td>
      <td class="p-3"><button onclick="removeStudent(${s.id})" class="text-rose-300 hover:text-rose-200">Excluir</button></td>
    </tr>`).join('') || '<tr><td colspan="5" class="p-6 text-center text-slate-400">Nenhum aluno encontrado.</td></tr>';
}
$('#studentForm').addEventListener('submit', async e => {
  e.preventDefault(); const data = Object.fromEntries(new FormData(e.target));
  data.grade = Number(data.grade); data.attendance = Number(data.attendance);
  const r = await fetch('/api/students', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const result = await r.json().catch(()=>({}));
  if (!r.ok) { $('#message').textContent = result.error || 'Não foi possível cadastrar.'; return; }
  $('#message').textContent = 'Aluno cadastrado com sucesso.'; e.target.reset(); e.target.elements.attendance.value=100; await load();
});
async function removeStudent(id) {
  if (!confirm('Deseja realmente excluir este aluno?')) return;
  const r = await fetch('/api/students/'+id,{method:'DELETE'});
  if (!r.ok) alert('Não foi possível excluir.'); await load();
}
$('#search').addEventListener('input',render);
load().catch(()=>$('#message').textContent='Erro ao carregar. Confira se o servidor e o PostgreSQL estão ativos.');
</script>
</body></html>
